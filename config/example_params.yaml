# Since this parameter file uses variable expansion, it is meant to be use along with an instruction
# ParameterFile(<params_file>, allow_substs=True) in a launch file
/**/fork_position_controller_server:
  ros__parameters:
    # use_sim_time IS automatically handled, no need to specify here.

    # Position command topic.
    command_topic: joint_commands/fork

    # JointState topic used to read the measured fork position.
    joint_states_topic: joint_states

    # This must match exactly the entry published in JointState.name.
    joint_name: robot_fork_carriage_joint

    # These limits must match the fork joint limits configured in the robot xacro/URDF.
    lower_limit: -0.005
    upper_limit: 0.8

    # Goal succeeds when the measured position is within this absolute tolerance from the target.
    position_tolerance: 0.01

    # Rate at which the current position command is continuously published to the backend.
    command_publish_frequency: 10.0 # Hz

    # Rate at which the action server publishes feedback while a goal is active.
    feedback_publish_frequency: 10.0 # Hz

    # Rate at which the execution loop runs (convergence checks, cancellation, timeouts).
    # Must be >= max(command_publish_frequency, feedback_publish_frequency).
    execution_loop_frequency: 30.0 # Hz

    # Abort the goal if convergence is not achieved before this timeout expires.
    goal_timeout: 20.0 # s

    # Abort the goal if the measured JointState becomes too old.
    joint_state_timeout: 1.0 # s
